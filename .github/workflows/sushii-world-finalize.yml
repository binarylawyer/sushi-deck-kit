name: Finalize Sushii World artifact integrity repair

on:
  push:
    branches:
      - fix/sushii-world-artifact-integrity
    paths:
      - ".artifact-fix/FINALIZE_READY"

permissions:
  contents: write

concurrency:
  group: sushii-world-finalize-repair
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sushii-world-artifact-integrity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Download verified source archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://filebin.net/sushiiworld-fix-9b1370ba/archive.zip' \
            -o /tmp/sushii-world-fix.zip
          printf '%s  %s\n' \
            '9b1370baffd287e67207af83bb6acb828ee67534fde56b6e932f9d970e8d5263' \
            '/tmp/sushii-world-fix.zip' | sha256sum --check --strict
          rm -rf /tmp/sushii-world-fix
          mkdir -p /tmp/sushii-world-fix
          unzip -q /tmp/sushii-world-fix.zip -d /tmp/sushii-world-fix

      - name: Verify and install canonical files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '0ca9089ae53cda7ede2ad8ef78f85de3690f2503e71925728142cc56c7467f87' '/tmp/sushii-world-fix/examples/sushii-world/sushii-world-presentation.html' \
            '58cd39c5c18c2facbee380586aaf9d1ddada7e4a5786c41b06d4c2758bf1fe6c' '/tmp/sushii-world-fix/examples/sushii-world/assets/bento-composition.webp' \
            'fe2bedce30874e4b62bbc929bc64d39db964711d3d2dd848e975d374570d6231' '/tmp/sushii-world-fix/examples/sushii-world/assets/jubako-stack.webp' \
            'e51efdbea46529523dad0223555bd18d89c5e367270d4de45218b5c900156b5a' '/tmp/sushii-world-fix/examples/sushii-world/assets/wrapped-roll.webp' | sha256sum --check --strict
          mkdir -p examples/sushii-world/assets
          cp /tmp/sushii-world-fix/examples/sushii-world/sushii-world-presentation.html examples/sushii-world/sushii-world-presentation.html
          cp /tmp/sushii-world-fix/examples/sushii-world/assets/bento-composition.webp examples/sushii-world/assets/bento-composition.webp
          cp /tmp/sushii-world-fix/examples/sushii-world/assets/jubako-stack.webp examples/sushii-world/assets/jubako-stack.webp
          cp /tmp/sushii-world-fix/examples/sushii-world/assets/wrapped-roll.webp examples/sushii-world/assets/wrapped-roll.webp

      - name: Validate presentation and package contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('examples/sushii-world/sushii-world-presentation.html', 'utf8');
          const slides = [...html.matchAll(/<section\b[^>]*\bid=["'](s\d+)["']/gi)].map(m => m[1]);
          const expected = Array.from({length: 19}, (_, i) => `s${i + 1}`);
          if (JSON.stringify(slides) !== JSON.stringify(expected)) throw new Error(`slide mismatch: ${slides.join(',')}`);
          for (const name of ['bento-composition.webp','jubako-stack.webp','wrapped-roll.webp']) {
            const ref = `assets/${name}`;
            if (!html.includes(ref)) throw new Error(`missing HTML ref ${ref}`);
            if (!fs.existsSync(`examples/sushii-world/${ref}`)) throw new Error(`missing file ${ref}`);
          }
          if ([...html.matchAll(/(?:src|href)=["'](https?:\/\/[^"']+)/gi)].length) throw new Error('external runtime asset URL found');
          for (const marker of ['@media print','keydown','ArrowRight','ArrowLeft']) if (!html.includes(marker)) throw new Error(`missing ${marker}`);
          if (!/speaker|notes?/i.test(html)) throw new Error('speaker/notes marker missing');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          if (!pkg.files?.includes('examples')) throw new Error('examples not packaged');
          if (pkg.exports?.['./examples/sushii-world/presentation.html'] !== './examples/sushii-world/sushii-world-presentation.html') throw new Error('presentation export incorrect');
          if (pkg.exports?.['./examples/sushii-world/assets/*'] !== './examples/sushii-world/assets/*') throw new Error('asset export incorrect');
          NODE

      - name: Run kit tests
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Verify packed artifact contents
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('/tmp/pack.json','utf8'));
          if (!Array.isArray(result) || !result[0]?.files) throw new Error('unexpected npm pack JSON');
          const paths = new Set(result[0].files.map(f => f.path));
          const required = [
            'examples/sushii-world/README.md',
            'examples/sushii-world/sushii-world-presentation.html',
            'examples/sushii-world/assets/bento-composition.webp',
            'examples/sushii-world/assets/jubako-stack.webp',
            'examples/sushii-world/assets/wrapped-roll.webp'
          ];
          const missing = required.filter(p => !paths.has(p));
          if (missing.length) throw new Error(`npm pack missing: ${missing.join(', ')}`);
          NODE

      - name: Ensure branch did not move during verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/sushii-world-artifact-integrity
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/sushii-world-artifact-integrity)"

      - name: Remove all repair scaffolding and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .artifact-transfer .artifact-fix
          rm -f .github/workflows/sushii-world-transfer.yml
          rm -f .github/workflows/sushii-world-integrity-fix.yml
          rm -f .github/workflows/sushii-world-remote-fix.yml
          rm -f .github/workflows/sushii-world-remote-diagnostic.yml
          rm -f .github/workflows/sushii-world-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore verified Sushii World artifact bytes'
          git push origin HEAD:fix/sushii-world-artifact-integrity

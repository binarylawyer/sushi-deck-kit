name: Sushii World artifact transfer

on:
  push:
    branches:
      - feat/sushii-world-reference-artifact
    paths:
      - ".artifact-transfer/READY"

permissions:
  contents: write

concurrency:
  group: sushii-world-artifact-transfer
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sushii-world-reference-artifact

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Assemble and verify canonical artifact bytes
        shell: bash
        run: |
          set -euo pipefail
          for stem in html bento-composition jubako-stack wrapped-roll; do
            compgen -G ".artifact-transfer/${stem}.part*" > /dev/null
          done

          mkdir -p examples/sushii-world/assets
          cat .artifact-transfer/html.part* | base64 --decode > examples/sushii-world/sushii-world-presentation.html
          cat .artifact-transfer/bento-composition.part* | base64 --decode > examples/sushii-world/assets/bento-composition.webp
          cat .artifact-transfer/jubako-stack.part* | base64 --decode > examples/sushii-world/assets/jubako-stack.webp
          cat .artifact-transfer/wrapped-roll.part* | base64 --decode > examples/sushii-world/assets/wrapped-roll.webp

          printf '%s  %s\n' \
            '0ca9089ae53cda7ede2ad8ef78f85de3690f2503e71925728142cc56c7467f87' 'examples/sushii-world/sushii-world-presentation.html' \
            'a879f731be9d403284dbc78588a837b367222df9f1414a35f61a601cb83f80be' 'examples/sushii-world/assets/bento-composition.webp' \
            '84820498cbcfa3bd29a0db02cc1f0b5d5fd2fbacbcfc934e4c19ec8f3ef1db64' 'examples/sushii-world/assets/jubako-stack.webp' \
            'f97636bf6fca5804384d05699df712ddfeae03934bbe73d58d91ffdb40dd06db' 'examples/sushii-world/assets/wrapped-roll.webp' | sha256sum --check --strict

      - name: Validate presentation structure and offline references
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('examples/sushii-world/sushii-world-presentation.html', 'utf8');
          const slides = [...html.matchAll(/<section\b[^>]*\bid=["'](s\d+)["']/gi)].map((m) => m[1]);
          const expected = Array.from({ length: 19 }, (_, i) => `s${i + 1}`);
          if (JSON.stringify(slides) !== JSON.stringify(expected)) {
            throw new Error(`Expected slides s1..s19, found: ${slides.join(', ')}`);
          }
          const requiredAssets = [
            'assets/bento-composition.webp',
            'assets/jubako-stack.webp',
            'assets/wrapped-roll.webp',
          ];
          for (const ref of requiredAssets) {
            if (!html.includes(ref)) throw new Error(`Missing asset reference: ${ref}`);
            if (!fs.existsSync(`examples/sushii-world/${ref}`)) throw new Error(`Missing asset file: ${ref}`);
          }
          const externalRefs = [...html.matchAll(/(?:src|href)=["'](https?:\/\/[^"']+)/gi)].map((m) => m[1]);
          if (externalRefs.length) throw new Error(`External runtime references found: ${externalRefs.join(', ')}`);
          for (const marker of ['@media print', 'keydown', 'ArrowRight', 'ArrowLeft']) {
            if (!html.includes(marker)) throw new Error(`Missing presentation behavior marker: ${marker}`);
          }
          if (!/speaker|notes?/i.test(html)) throw new Error('Speaker-note behavior marker not found');
          console.log('Sushii World structure: 19 slides; local assets; navigation, notes, and print behavior present.');
          NODE

      - name: Install and run kit checks
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Verify npm package contents
        shell: bash
        run: |
          npm pack --dry-run --json > /tmp/sushii-pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('/tmp/sushii-pack.json', 'utf8'));
          const paths = new Set(result[0].files.map((file) => file.path));
          const required = [
            'examples/sushii-world/README.md',
            'examples/sushii-world/sushii-world-presentation.html',
            'examples/sushii-world/assets/bento-composition.webp',
            'examples/sushii-world/assets/jubako-stack.webp',
            'examples/sushii-world/assets/wrapped-roll.webp',
          ];
          const missing = required.filter((path) => !paths.has(path));
          if (missing.length) throw new Error(`npm pack is missing: ${missing.join(', ')}`);
          console.log('npm pack includes the Sushii World HTML, README, and all three assets.');
          NODE

      - name: Commit verified artifact and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .artifact-transfer
          rm -f .github/workflows/sushii-world-transfer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: install verified Sushii World artifact bytes"
          git push origin HEAD:feat/sushii-world-reference-artifact

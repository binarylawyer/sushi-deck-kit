name: Sushii World artifact transfer

on:
  push:
    branches:
      - feat/sushii-world-reference-artifact
    paths:
      - ".artifact-transfer/**"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sushii-world-reference-artifact

      - name: Wait for all transfer parts
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            html.part01 html.part02 html.part03 html.part04
            jubako-stack.part01 jubako-stack.part02 jubako-stack.part03
            wrapped-roll.part01 wrapped-roll.part02 wrapped-roll.part03
            bento-composition.part01 bento-composition.part02 bento-composition.part03 bento-composition.part04
          )
          for part in "${expected[@]}"; do
            if [ ! -f ".artifact-transfer/$part" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Assemble canonical artifact
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p examples/sushii-world/assets
          cat .artifact-transfer/html.part* | base64 --decode > examples/sushii-world/sushii-world-presentation.html
          cat .artifact-transfer/jubako-stack.part* | base64 --decode > examples/sushii-world/assets/jubako-stack.webp
          cat .artifact-transfer/wrapped-roll.part* | base64 --decode > examples/sushii-world/assets/wrapped-roll.webp
          cat .artifact-transfer/bento-composition.part* | base64 --decode > examples/sushii-world/assets/bento-composition.webp
          printf '%s  %s\n' \
            '0ca9089ae53cda7ede2ad8ef78f85de3690f2503e71925728142cc56c7467f87' 'examples/sushii-world/sushii-world-presentation.html' \
            '84820498cbcfa3bd29a0db02cc1f0b5d5fd2fbacbcfc934e4c19ec8f3ef1db64' 'examples/sushii-world/assets/jubako-stack.webp' \
            'f97636bf6fca5804384d05699df712ddfeae03934bbe73d58d91ffdb40dd06db' 'examples/sushii-world/assets/wrapped-roll.webp' \
            'a879f731be9d403284dbc78588a837b367222df9f1414a35f61a601cb83f80be' 'examples/sushii-world/assets/bento-composition.webp' | sha256sum --check --strict

      - name: Commit assembled artifact
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .artifact-transfer
          rm -f .github/workflows/sushii-world-transfer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Sushii World reference artifact assets"
          git push origin HEAD:feat/sushii-world-reference-artifact
